apiVersion: apps/v1
kind: Deployment
metadata:
  name: infraforge-web
spec:
  replicas: 2
  selector:
    matchLabels:
      app: infraforge-web
  template:
    metadata:
      labels:
        app: infraforge-web
    spec:
      containers:
        - name: nginx
          image: ghcr.io/dp0912/infraforge-web:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 80
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 2
            periodSeconds: 5
          resources:
            requests:
              cpu: "25m"
              memory: "32Mi"
            limits:
              cpu: "250m"
              memory: "128Mi"